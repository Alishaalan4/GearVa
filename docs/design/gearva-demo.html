.join('')+`<div class="kv"><span>Total</span><b>$ ${S.cart.reduce((a,i)=>a+i.p,0)}</b></div><button class="btn" style="width:100%;margin-top:10px" onclick="qFinish()">Finish visit and create invoice</button>`:'<p class="sb">Save a service to add it to this visit.</p>'}<h2 style="margin-top:16px">Filled automatically</h2><div class="kv"><span>Date</span><b>${dt(TODAY)}</b></div><div class="kv"><span>Mechanic</span><b>Rami</b></div><div class="kv"><span>Reminder</span><b>Scheduled on save</b></div></div></div>`},
invs(){const sel=S.inv?S.invs.find(i=>i.id===S.inv):null;let doc='';if(sel){const c=cu(sel.c),rs=inRecs(sel.id),t=inTot(sel.id),p=inPaid(sel.id),nx=rs[0],car=carOf(c,nx.pl);

rev(){const t=S.recs.reduce((a,r)=>a+r.p,0),col=S.recs.filter(r=>r.paid).reduce((a,r)=>a+r.p,0),by={};S.recs.forEach(r=>by[r.s]=(by[r.s]||0)+r.p);const mx=Math.max(1,...Object.values(by));

apps(){return head('Applications','Garages that applied from the website')+`<div class="card">${tbl(['Garage','Owner','Email','Phone','Location','Branches','Date','Status','Action'],S.apps.slice().reverse().map(a=>`<tr><td>${a.b}${a.m?'<div class="sb">'+a.m+'</div>':''}</td><td>${a.o}</td><td>${a.e}</td><td>${a.p}</td><td>${a.l||'-'}</td><td>${a.br}</td><td>${dt(a.d)}</td><td>${pill(a.st,a.st==='New'?'o':a.st==='Approved'?'ok':'n')}</td><td>${a.st==='New'?`<button class="btn s" onclick="appAct(${a.id},'ok')">Approve</button> <button class="btn s l" onclick="appAct(${a.id},'no')">Reject</button>`:a.cred?'<span class="sb">Login: '+a.cred+'</span>':''}</td></tr>`).join('')||'<tr><td colspan="9">No applications yet.</td></tr>')}<p class="sb">Approving creates the garage with an email and password and a 30-day free trial.</p></div>`},
gar(){return head('Garages',S.garages.length+' garages','<button class="btn" onclick="S.ng=!S.ng;render()">Create garage</button>')+(S.ng?`<div class="card"><h2>Create garage</h2><p class="sb" style="margin:0 0 10px">The email and password you set here are the garage’s login for V1.</p><div class="f">${fld('gn','Business name','New Garage')}${fld('gl','Store location (text)','Baabda')}${fld('ge','Email (V1 login)','newgarage@mail.com')}${fld('gw','Password (V1 login)','Gearva#2026')}${fld('gp','Phone number','+961 70 000 000')}${fld('gb','Branches','1')}</div><div class="row"><button class="chip ${S.trial?'on':''}" onclick="ncKeep();S.trial=!S.trial;render()">Free trial, 30 days</button></div><button class="btn" onclick="newG()">Create account</button></div>`:'')+`<div class="card">${tbl(['Business','Email','Phone','Branches','Status','Paid until','Action'],S.garages.map(g=>`<tr><td>${g.name}</td><td>${g.email}</td><td>${g.phone}</td><td>${g.br}</td><td>${pill(g.st,gk(g))}</td><td>${dt(g.until)}</td><td><button class="btn s l" onclick="gAct(${g.id},'pay')">Mark paid</button> <button class="btn s l" onclick="gAct(${g.id},'sus')">${g.st==='Suspended'?'Reactivate':'Suspend'}</button> <button class="btn s l" onclick="gAct(${g.id},'pw')">Reset password</button></td></tr>`).join(''))}<p class="sb">Unpaid, expired or suspended garages are locked out of V1 automatically.</p></div>`},
subs(){const ex=S.garages.filter(g=>g.until<=addDays(TODAY,45)).sort((a,b)=>a.until<b.until?-1:1);return head('Subscriptions','Payments, expiry and renewals')+`<div class="cols"><div class="card"><h2>Expiring soon or expired</h2>${tbl(['Garage','Paid until','Status'],ex.map(g=>`<tr><td>${g.name}</td><td>${dt(g.until)}</td><td>${pill(g.until<TODAY?'Expired':'Expiring',g.until<TODAY?'bad':'o')}</td></tr>`).join(''))}</div><div class="card"><h2>Record payment</h2><label>Garage</label><select class="in" id="sg">${S.garages.map(g=>`<option value="${g.id}">${g.name}</option>`).join('')}</select><div style="height:10px"></div><label>Amount ($)</label><input class="in" id="sa" value="355"><div class="row">${['Cash','Whish'].map(m=>`<button class="chip ${S.pm===m?'on':''}" onclick="S.pm='${m}';render()">${m}</button>`).join('')}</div><button class="btn" onclick="recPay()">Save payment</button></div></div><div class="card" style="margin-top:16px"><h2>Payments</h2>${tbl(['Garage','Date','Amount','Method'],S.pays.slice().reverse().map(p=>`<tr><td>${p.g}</td><td>${dt(p.d)}</td><td>$ ${p.a}</td><td>${p.m}</td></tr>`).join(''))}</div>`},
use(){return head('Usage and WhatsApp','Fair-use cap: 500 messages per garage per month')+`<div class="card">${tbl(['Garage','Customers','Invoices','WhatsApp / cap'],S.garages.map(g=>`<tr><td>${g.name}</td><td>${g.cu+S.D[g.id].custs.length}</td><td>${g.iv+S.D[g.id].invs.length}</td><td>${g.wa+S.rlog.filter(l=>l.g===g.id&&l.ch.includes('WhatsApp')).length} / 500 ${g.wa>=400?pill('Near cap','o'):''}</td></tr>`).join(''))}</div>`},
my(){const {c,d,g}=S.app,L=Object.values(latestOf(d.recs,c.id)),msgs=S.rlog.filter(l=>l.g===g.id&&l.cid===c.id&&l.ch.includes('App'));

myo(){const {d,g}=S.app;return head('Offers','From '+g.name)+d.offers.map(o=>`<div class="card"><div class="hero"><span class="p o">LIMITED TIME</span><b>${o.t}</b><div style="color:#C9D1CF">Valid until ${dt(o.u)}</div></div></div>`).join('')||'<div class="card">No offers right now.</div>'}};
const cRows=()=>{const q=S.q.toLowerCase();return S.custs.filter(c=>(c.name+c.email+c.phone+c.cars.map(x=>x.pl).join('')).toLowerCase().includes(q)).filter(c=>S.f==='All'||(S.f==='Due soon'&&stOf(c).rk>0)||(S.f==='Unpaid'&&S.recs.some(r=>r.c===c.id&&!r.paid))).map(c=>{const s=stOf(c);return `<tr class="k" onclick="openC(${c.id})"><td>${c.name}</td><td>${c.email}</td><td>${c.phone}</td><td>${c.cars.map(x=>x.pl).join(', ')}</td><td>${c.cars.map(x=>x.car).join(', ')}</td><td>${pill(s.t,s.k)}</td></tr>`}).join('')};
const NCI={nn:1,ne:1,npw:1,np:1,ncp:1,ncc:1,nck:1,ncp2:1,ncc2:1,nck2:1,gn:1,gl:1,ge:1,gw:1,gp:1,gb:1};

function openC(id){S.cid=id;S.view='detail';S.ac=false;render();scrollTo(0,0)}
function addC(){const v=k=>$('#'+k).value.trim();if(!v('nn')||!v('ne')||!v('npw')||!v('ncp')){toast('Name, email, password and a car plate are required');return}if(S.custs.some(c=>c.email.toLowerCase()===v('ne').toLowerCase())){toast('This email is already used');return}const cars=[{pl:v('ncp'),car:v('ncc')||'Car',km:+v('nck')||0,u:'KM'}];if(S.nc2&&v('ncp2'))cars.push({pl:v('ncp2'),car:v('ncc2')||'Car',km:+v('nck2')||0,u:'KM'});S.custs.push(mk(Math.max(0,...S.custs.map(c=>c.id))+1,v('nn'),v('ne'),v('npw'),v('np'),cars));S.ncv={};S.nc=false;S.nc2=false;toast('Customer added. They can log in to the mobile app with this email and password.');render()}

function remOne(id){const c=cu(id);S.rem={cid:id,msg:remText(c)};render();scrollTo(0,0)}

function remSend(){const msg=$('#rm').value.trim(),chs=Object.keys(S.ch).filter(k=>S.ch[k]);if(!chs.length){toast('Choose at least one channel');return}if(!msg){toast('Write a message first');return}let t=S.rem.cid?[cu(S.rem.cid)]:S.custs.filter(c=>S.rem.to==='All customers'||(S.rem.to==='Due soon'&&stOf(c).rk===1)||(S.rem.to==='Overdue'&&stOf(c).rk===2));t.forEach(c=>S.rlog.push({g:S.gid,cid:c.id,n:c.name,ch:chs.map(k=>k==='App'?'Mobile app':k).concat([]).map(x=>x==='Mobile app'?'App':x),m:msg}));S.rem=null;toast('Sent to '+t.length+' customer'+(t.length===1?'':'s')+' through '+chs.map(k=>k==='App'?'the mobile app':k).join(', '));render()}

function qSvc(s){S.qe.svc=s;document.querySelectorAll('.sv').forEach(b=>b.classList.toggle('on',b.dataset.s===s));$('#qoil').style.display=s==='Oil change'?'block':'none';qCalc()}

function stepGo(n){const v1=()=>enterV1(S.g);
if(n===1){S.role='v2';S.view='gar';S.ng=true}

else if(n===4){if(!v1())return;S.view='cust';S.nc=true}
else if(n===5||n===13){if(!v1())return;S.view='quick'}
else if(n===6){if(!v1())return;S.view='invs'}
else if(n===7){if(!v1())return;S.view='offers'}
else if(n===8||n===9){if(!v1())return;S.view='dash'}
else if(n===11){S.role='app';S.app=null;A.scr='login'}
else if(n===12){S.role='app';if(!aAuto())return;A.scr='services'}
render();scrollTo(0,0)}

return `<div class="bd">${hdr('Invoice',1)}<div class="card"><b>${g.name}</b><div class="sb">${g.loc} · ${g.phone}</div></div><div class="card"><div class="kv"><span>Invoice</span><b>${ino(r.inv)}</b></div><div class="kv"><span>Date</span><b>${dt(r.d)}</b></div><div class="kv"><span>Car</span><b>${car.car.split(' ').slice(0,2).join(' ')} · ${r.pl}</b></div></div><div class="card">${rs.map(x=>`<div class="kv"><span>${x.s}${x.b?', '+x.b:''}${x.q?' ('+x.q+(isOil(x.s)?' L':'')+')':''}${x.fc?'<br><small>Oil filter: '+(x.fb||'changed')+'</small>':''}</span><b>$ ${x.p}</b></div>`).join('')}<div class="kv" style="border-top:1px solid var(--line);margin-top:6px;padding-top:10px"><b>Total</b><b>$ ${t}</b></div><div class="kv"><span>Paid</span><b>$ ${p}</b></div><div class="kv"><span>Remaining</span><b>${t-p>0?pill('$ '+(t-p),'bad'):pill('Paid','ok')}</b></div></div><div class="nt">Next service: ${rs.map(x=>x.s.toLowerCase()+' at '+nxA(x)+' or '+dt(x.nd)).join('; ')}</div><button class="btn" onclick="toast('Invoice PDF saved')">${ico('share',20,'#101A19')}Download PDF</button><button class="btn l" onclick="aGo('garage')">Contact garage</button></div>`},
offers(){const O=ad().offers,exp=o=>o.u>=TODAY&&o.u<=addDays(TODAY,30),L=O.filter(o=>A.of==='All'||(A.of==='Active'&&o.u>=TODAY)||(A.of==='Expiring'&&exp(o))),f=L[0];
return `<div class="bd">${hdr('Offers')}<div class="row">${['All','Active','Expiring'].map(k=>`<button class="chip ${A.of===k?'on':''}" onclick="A.of='${k}';render()">${k}</button>`).join('')}</div>${f?`<div class="dkc"><span class="p o">LIMITED TIME</span><b style="font-size:24px;margin:10px 0 4px;text-transform:uppercase">${f.t}</b><small>${ag().name} · until ${dt(f.u)}</small><button class="btn" style="margin-top:14px" onclick="aGo('offer',${O.indexOf(f)})">View offer</button></div>`:'<div class="card"><p class="sb">No offers right now.</p></div>'}${L.length>1?`<div class="sec2">More offers</div><div class="card" style="padding:4px 16px">${L.slice(1).map(o=>`<div class="lr" onclick="aGo('offer',${O.indexOf(o)})"><div><b>${o.t}</b><small>${ag().name} · until ${dt(o.u)}</small></div>${exp(o)?pill('Expiring','o'):''}</div>`).join('')}</div>`:''}</div>${TB('offers')}`},
offer(){const o=ad().offers[A.off];
return `<div class="bd">${hdr('Offer',1)}<div class="dkc"><span class="p o">LIMITED TIME</span><b style="font-size:24px;margin:10px 0 4px;text-transform:uppercase">${o.t}</b><small>${ag().name} · until ${dt(o.u)}</small></div><div class="card"><h2>Details</h2><div class="kv"><span>Valid until</span><b>${dt(o.u)}</b></div><div class="kv"><span>Garage</span><b>${ag().name}</b></div></div><div class="nt">Mention this offer at the garage when you visit.</div><button class="btn" onclick="toast('Calling ${ag().name}')">${ico('phone',18,'#101A19')}Call garage</button><button class="btn l" onclick="toast('Opening WhatsApp with ${ag().name}')">${ico('wa',18,'#101A19')}Message on WhatsApp</button></div>`},
notifs(){const L=notifs().filter(n=>A.nf==='All'||(A.nf==='Reminders'&&n.k==='r')||(A.nf==='Messages'&&n.k==='m'));
return `<div class="bd">${hdr('Notifications',1)}<div class="row">${['All','Reminders','Messages'].map(k=>`<button class="chip ${A.nf===k?'on':''}" onclick="A.nf='${k}';render()">${k}</button>`).join('')}</div>${L.map(n=>`<div class="pc" style="align-items:flex-start;cursor:default;${n.hl?'border-color:#FF600F':''}">${icc(n.i,40)}<div style="flex:1"><b>${n.t}</b><div style="margin:3px 0;line-height:1.4;color:#55605E">${n.m}</div><small>${n.w}</small></div>${n.hl?'<u class="dot"></u>':''}</div>`).join('')||'<div class="card"><p class="sb" style="line-height:1.5">Nothing here yet. In Garage V1 press Send reminder (tick Mobile app) or Run now, then come back.</p></div>'}</div>`},
profile(){const c=ac();
return `<div class="bd">${hdr('Profile')}<div class="pc" style="padding:16px;gap:14px;cursor:default"><div class="av" style="width:52px;height:52px;font-size:20px">${c.name[0]}</div><div><b style="font-size:16px">${c.name}</b><small>${c.email}</small><small>${c.phone}</small></div></div>${[['vehicles','car','My vehicles',c.cars.length+(c.cars.length===1?' car':' cars')],['nset','bell','Notifications',Object.keys(A.nt).filter(k=>A.nt[k]).map(k=>k==='App'?'app':k==='WhatsApp'?'WhatsApp':k.toLowerCase()).join(', ')||'Off'],['lang','globe','Language and units',A.lang+' · '+A.u],['garage','svc','My garage',ag().name],['help','help','Help and support','']].map(([k,i,l,s])=>`<div class="pc" onclick="aGo('${k}')">${icc(i,40)}<div style="flex:1"><b>${l}</b>${s?`<small>${s}</small>`:''}</div>${ico('chev',18,'#9AA3A1')}</div>`).join('')}<button class="btn" style="background:#FDE3DD;color:#8A1F0E;margin-top:4px" onclick="S.app=null;A.scr='welcome';render()">${ico('out',20,'#8A1F0E')}Log out</button></div>${TB('profile')}`},
vehicles(){return `<div class="bd">${hdr('My vehicles',1)}${ac().cars.map(car=>{const w=carSt(car),lv=lastVisit(car),s=w?w.x.s:0;return `<div class="card"><div style="display:flex;gap:12px;align-items:center">${icc('car',40)}<div style="flex:1"><b>${car.car}</b><div class="sb">${car.pl}</div></div>${pill(['OK','Due soon','Overdue'][s],['ok','o','bad'][s])}</div><div class="sb" style="margin-top:10px">Last recorded by your garage</div><b>${lv?aU(lv.km)+' · '+dt(lv.d):aU(car.km)}</b></div>`}).join('')}<div class="nt">Cars and mileage are added by your garage at each visit. To add another car, ask your garage.</div></div>`},
garage(){const g=ag();return `<div class="bd">${hdr('My garage',1)}<div class="card"><b style="font-size:17px">${g.name}</b><div class="kv" style="margin-top:8px;justify-content:flex-start;align-items:center">${ico('pin',18)}<span style="color:inherit">${g.loc}</span></div><div class="kv" style="justify-content:flex-start;align-items:center">${ico('phone',18)}<span style="color:inherit">${g.phone}</span></div><div class="kv" style="justify-content:flex-start;align-items:center">${ico('mail',18)}<span style="color:inherit">${g.email}</span></div></div><button class="btn" onclick="toast('Calling ${g.phone}')">${ico('phone',18,'#101A19')}Call</button><button class="btn l" onclick="toast('Opening WhatsApp')">${ico('wa',18,'#101A19')}WhatsApp</button><p class="sb" style="margin-top:14px">Questions about a service or an invoice? Contact your garage.</p></div>`},
nset(){const tg=(k,l,s)=>`<div class="lr" style="cursor:default;justify-content:flex-start">${icc({WhatsApp:'wa',Email:'mail',App:'bell'}[k],36)}<div style="flex:1"><b>${l}</b><small>${s}</small></div><button class="tg ${A.nt[k]?'on':''}" onclick="A.nt['${k}']=!A.nt['${k}'];render()" aria-label="${l}"></button></div>`;
return `<div class="bd">${hdr('Notifications',1)}<p class="sb" style="margin:-6px 0 8px;font-size:13px">Send my reminders by</p><div class="card" style="padding:4px 16px">${tg('WhatsApp','WhatsApp','Reminders and invoices')}${tg('Email','Email',ac().email)}${tg('App','Mobile app','Push notifications')}</div><p class="sb">Reminders are sent by your garage, in daytime hours only.</p></div>`},
lang(){const rd=(k)=>`<div class="lr" onclick="A.lang='${k}';render();${k==='Arabic'?'toast(\'Arabic and RTL come with the real app\')':''}"><b>${k}</b><span class="rd ${A.lang===k?'on':''}"></span></div>`;
return `<div class="bd">${hdr('Language and units',1)}<div class="card" style="padding:4px 16px"><div class="sb" style="padding-top:12px">Language</div>${rd('English')}${rd('Arabic')}</div><div class="card"><div class="sb">Distance unit</div><b>Show mileage in</b><div class="seg">${['KM','M'].map(u=>`<button class="${A.u===u?'on':''}" onclick="A.u='${u}';render()">${u}</button>`).join('')}</div><p class="sb">Miles are shown as km x 0.72, rounded. Your garage records mileage in km.</p></div></div>`},
help(){const Q=[['Why did I get a reminder?','Your garage sends a reminder when a service is close to its next change, by km or by date.'],['How is my next change decided?','Your garage sets it at each visit, based on the service and your car. You can see it on every service.'],['Why can’t I change my mileage?','Mileage is recorded by your garage at each visit so the history stays accurate.'],['Who can see my data?','Only you and the garage that serves you. Nothing is shared with other garages.']];
return `<div class="bd">${hdr('Help and support',1)}<div class="card"><b>Contact your garage</b><div style="height:10px"></div><button class="btn" onclick="toast('Calling ${ag().phone}')">${ico('phone',18,'#101A19')}Call</button><button class="btn l" onclick="toast('Opening WhatsApp')">${ico('wa',18,'#101A19')}WhatsApp</button></div><div class="sec2">Common questions</div><div class="card" style="padding:4px 16px">${Q.map((q,i)=>`<div class="lr" style="flex-wrap:wrap" onclick="A.faq=A.faq===${i}?-1:${i};render()"><b>${q[0]}</b><span>${A.faq===i?'−':'+'}</span>${A.faq===i?`<div class="sb" style="width:100%;line-height:1.5;font-weight:500">${q[1]}</div>`:''}</div>`).join('')}</div></div>`}};
function appStage(){const s=A.scr,out=!S.app&&s!=='welcome'&&s!=='login';if(out){A.scr='welcome'}const cur=A.scr;
let active=cur;if(cur==='home'&&S.app){const w=carSt(aCar());active=w&&w.x.s>0?'homedue':'home'}
const body=ASC[cur](),dk=cur==='welcome';
return `<div class="stage"><div><div class="pnl"><h1 style="font-size:22px">Customer app</h1><p class="sb" style="line-height:1.5">Read-only for the car owner. Mileage is recorded by the garage, never by the customer. The app shows the same data as the garage dashboard.</p><div class="kv"><span>Demo login</span><b>karim@mail.com / karim123</b></div></div><div class="pnl ml">${ASCR.map(([k,l],i)=>`<button class="${active===k?'on':''}" onclick="aGo('${k}')"><b>${i+1}</b>${l}</button>`).join('')}</div></div><div class="ph"><div class="sc ${dk?'dk0':''}"><div class="st"><span>9:41</span><span>●●● 5G</span></div>${body}</div></div></div>`}

function render(){$('#nav').innerHTML=navBar();const r=$('#root');
if(S.role==='flow'){r.innerHTML=flowView();return}
if(S.role==='app'){r.innerHTML=appStage();return}
if(!S.role){r.innerHTML=S.pub?landing():loginView();return}
const nav=NAV[S.role],act=S.view==='detail'?'cust':S.view,sub=S.role==='v1'?S.g.name:'Admin system';
r.innerHTML=`<div class="app"><aside class="side">${logo(1)}<div class="sub">${sub}</div>${nav.map(([k,l])=>`<button class="nv ${act===k?'on':''}" onclick="go('${k}')">${l}${k==='apps'&&S.apps.some(a=>a.st==='New')?' ('+S.apps.filter(a=>a.st==='New').length+')':''}</button>`).join('')}<div class="grow"></div><button class="nv" onclick="out()">Log out</button></aside><main class="main">${VIEWS[S.view]()}</main></div>`;
if(S.view==='quick'&&S.custs.length){qCalc();$('#qoil').style.display=S.qe.svc==='Oil change'?'block':'none'}}

render();
</script></body></html>
